<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ders Programı</title>
<meta name="description" content="Haftalık ders programı, ödev takibi ve ders notları.">
<meta name="theme-color" content="#0f1226">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ders Programı">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <h1 id="viewTitle">Bugün</h1>
  <div class="topbar-right">
    <span id="todayLabel" class="today-label"></span>
  </div>
</header>

<main id="main">

  <!-- ===== BUGÜN ===== -->
  <section id="view-today" class="view">
    <div id="nowCard" class="now-card" hidden>
      <span class="now-kicker" id="nowKicker">Şu anki ders</span>
      <strong class="now-name" id="nowName"></strong>
      <span class="now-meta" id="nowMeta"></span>
    </div>
    <div id="todayList" class="lesson-list"></div>
    <h2 class="section-h" id="todayTasksH" hidden>Yaklaşan ödevler</h2>
    <div id="todayTasks" class="task-list"></div>
  </section>

  <!-- ===== HAFTA ===== -->
  <section id="view-week" class="view" hidden>
    <div class="week-wrap">
      <div id="weekGrid" class="week-grid"></div>
    </div>
    <p id="weekEmpty" class="empty" hidden>Henüz ders eklenmedi. <b>Düzenle</b> sekmesinden ekleyebilirsin.</p>
  </section>

  <!-- ===== ÖDEVLER ===== -->
  <section id="view-tasks" class="view" hidden>
    <button class="btn primary block" id="addTaskBtn">+ Ödev / not ekle</button>
    <div id="taskList" class="task-list"></div>
    <label class="toggle-row">
      <input type="checkbox" id="showDone"> Tamamlananları göster
    </label>
  </section>

  <!-- ===== DÜZENLE ===== -->
  <section id="view-edit" class="view" hidden>
    <button class="btn primary block" id="addLessonBtn">+ Ders ekle</button>
    <div id="editList" class="edit-list"></div>
    <h2 class="section-h">Veri</h2>
    <div class="row-btns">
      <button class="btn" id="exportBtn">Yedek al (JSON)</button>
      <button class="btn" id="importBtn">Yedeği geri yükle</button>
      <button class="btn danger" id="resetBtn">Programı sıfırla</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <p class="hint">Veriler yalnızca bu telefonun tarayıcısında saklanır. Telefon değiştirirken yedek al.</p>
  </section>

</main>

<nav class="tabbar">
  <button class="tab is-active" data-view="today"><span class="ico">📅</span>Bugün</button>
  <button class="tab" data-view="week"><span class="ico">🗓️</span>Hafta</button>
  <button class="tab" data-view="tasks"><span class="ico">✓</span>Ödev</button>
  <button class="tab" data-view="edit"><span class="ico">⚙️</span>Düzenle</button>
</nav>

<!-- ===== Ders formu ===== -->
<dialog id="lessonDlg" class="sheet">
  <form id="lessonForm" method="dialog">
    <h2 id="lessonDlgTitle">Ders ekle</h2>
    <label>Ders adı
      <input name="name" required maxlength="60" placeholder="Matematik">
    </label>
    <label>Gün
      <select name="day" id="daySelect"></select>
    </label>
    <div class="two">
      <label>Başlangıç <input name="start" type="time" required value="09:00"></label>
      <label>Bitiş <input name="end" type="time" required value="09:50"></label>
    </div>
    <div class="two">
      <label>Derslik <input name="room" maxlength="30" placeholder="B-204"></label>
      <label>Öğretmen <input name="teacher" maxlength="40" placeholder="Ayşe Yılmaz"></label>
    </div>
    <label>Renk</label>
    <div class="swatches" id="swatches"></div>
    <p class="err" id="lessonErr" hidden></p>
    <div class="sheet-btns">
      <button type="button" class="btn" id="lessonCancel">Vazgeç</button>
      <button type="button" class="btn danger" id="lessonDelete" hidden>Sil</button>
      <button type="button" class="btn primary" id="lessonSave">Kaydet</button>
    </div>
  </form>
</dialog>

<!-- ===== Ödev formu ===== -->
<dialog id="taskDlg" class="sheet">
  <form id="taskForm" method="dialog">
    <h2 id="taskDlgTitle">Ödev ekle</h2>
    <label>Başlık
      <input name="title" required maxlength="80" placeholder="Sayfa 42 sorular">
    </label>
    <label>Ders
      <select name="lessonId" id="taskLessonSelect"></select>
    </label>
    <label>Teslim tarihi
      <input name="due" type="date">
    </label>
    <label>Not
      <textarea name="note" rows="3" maxlength="500" placeholder="İstersen detay yaz…"></textarea>
    </label>
    <div class="sheet-btns">
      <button type="button" class="btn" id="taskCancel">Vazgeç</button>
      <button type="button" class="btn danger" id="taskDelete" hidden>Sil</button>
      <button type="button" class="btn primary" id="taskSave">Kaydet</button>
    </div>
  </form>
</dialog>

<!-- ===== Ders detay ===== -->
<dialog id="detailDlg" class="sheet">
  <h2 id="detailName"></h2>
  <p class="detail-meta" id="detailMeta"></p>
  <label>Ders notu
    <textarea id="detailNote" rows="5" maxlength="2000" placeholder="Kitap, sınav tarihi, hoca notu…"></textarea>
  </label>
  <h3 class="section-h" id="detailTasksH" hidden>Bu dersin ödevleri</h3>
  <div id="detailTasks" class="task-list"></div>
  <div class="sheet-btns">
    <button class="btn" id="detailClose">Kapat</button>
    <button class="btn primary" id="detailEdit">Dersi düzenle</button>
  </div>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="js/app.js"></script>
</body>
</html>
